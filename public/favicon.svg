<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <defs>
    <!-- Obsidian Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#06241c"/>
    </linearGradient>

    <!-- Emerald Aperture Gradient -->
    <linearGradient id="emeraldArc" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Teal Aperture Gradient -->
    <linearGradient id="tealArc" x1="26" y1="26" x2="6" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Amber Spotlight Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Radar Reticle Crosshair Guides -->
  <circle cx="16" cy="16" r="9.5" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2 2"/>
  <line x1="16" y1="4.5" x2="16" y2="27.5" stroke="#10b981" stroke-width="0.6" stroke-opacity="0.2"/>
  <line x1="4.5" y1="16" x2="27.5" y2="16" stroke="#10b981" stroke-width="0.6" stroke-opacity="0.2"/>

  <!-- Scanning Aperture / Investigative Lens Arcs -->
  <path d="M 8.5 20 C 7.2 12.5, 12.8 7.5, 20.5 7.5" stroke="url(#emeraldArc)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 23.5 12 C 24.8 19.5, 19.2 24.5, 11.5 24.5" stroke="url(#tealArc)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Central IQ Lens Ring -->
  <circle cx="16" cy="16" r="4.2" stroke="#34d399" stroke-width="1.8" fill="#064e3b" fill-opacity="0.5"/>

  <!-- The "Blindspot" Spotlight Beacon (Uncovered in the upper-right focal quadrant) -->
  <circle cx="21.5" cy="10.5" r="3.8" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.5"/>
  <circle cx="21.5" cy="10.5" r="2.4" fill="url(#amberGlow)"/>
</svg>
